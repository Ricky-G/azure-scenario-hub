apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-backend-nginx
  labels:
    app.kubernetes.io/name: hello-backend
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /hello {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Backend-Service "mock-onprem-aks" always;
        add_header X-Backend-Request-Id "$http_x_scenario_request_id" always;
        return 200 '{"message":"Hello World","backend":"mock-onprem-aks","service":"hello-backend","requestId":"$http_x_scenario_request_id"}';
      }

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-backend
  labels:
    app.kubernetes.io/name: hello-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-config
          configMap:
            name: hello-backend-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hello-backend
  labels:
    app.kubernetes.io/name: hello-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hello-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: hello-backend-internal
  labels:
    app.kubernetes.io/name: hello-backend
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
    service.beta.kubernetes.io/azure-load-balancer-ipv4: "10.20.1.20"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: hello-backend
  ports:
    - name: http
      port: 80
      targetPort: http