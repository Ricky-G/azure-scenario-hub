openapi: 3.0.3
info:
  title: Azure OpenAI Chat Completions
  version: 1.0.0
  description: Text chat completions through an API Management subscription.
paths:
  /openai/deployments/{deployment-id}/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Create a chat completion
      parameters:
        - name: deployment-id
          in: path
          required: true
          schema:
            type: string
          description: Foundry chat deployment name, which may differ from the underlying model name.
        - name: api-version
          in: query
          required: true
          schema:
            type: string
            default: '__DEFAULT_OPENAI_API_VERSION__'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat completion or streamed response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
        '401':
          description: Missing or invalid APIM subscription key.
        '429':
          description: Request rate exceeded.
      security:
        - subscriptionKey: []
components:
  securitySchemes:
    subscriptionKey:
      type: apiKey
      in: header
      name: api-key
  schemas:
    ChatRequest:
      type: object
      required:
        - messages
      properties:
        messages:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [system, user, assistant]
              content:
                type: string
        max_completion_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stream:
          type: boolean
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                type: object
                properties:
                  role:
                    type: string
                  content:
                    type: string
              finish_reason:
                type: string
                nullable: true
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer